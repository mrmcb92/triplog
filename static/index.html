// ── MapView ───────────────────────────────────────────────────────────────────
function MapView({coords,points,isActive,t}){
  const containerRef=useRef(null);
  const mapRef=useRef(null);
  const tileRef=useRef(null);
  const polyRef=useRef(null);
  const markersRef=useRef([]);

  useEffect(()=>{
    const L=window.L;
    if(!L||!containerRef.current)return;
    if(!mapRef.current){
      mapRef.current=L.map(containerRef.current,{center:[45.9432,24.9668],zoom:7,zoomControl:true});
      tileRef.current=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(mapRef.current);
    }
  },[]);

  useEffect(()=>{
    if(isActive && mapRef.current){
      setTimeout(()=>{
        mapRef.current?.invalidateSize();
        if(polyRef.current && polyRef.current.getBounds && polyRef.current.getBounds().isValid()){
          mapRef.current.fitBounds(polyRef.current.getBounds(),{padding:[30,30]});
        }
      },120);
    }
  },[isActive]);

  useEffect(()=>{
    const L=window.L;
    const map=mapRef.current;
    if(!L||!map)return;

    if(polyRef.current){map.removeLayer(polyRef.current);polyRef.current=null}
    markersRef.current.forEach(m=>map.removeLayer(m));
    markersRef.current=[];

    if(!coords||!coords.length)return;

    const ll=coords.map(([lon,lat])=>[lat,lon]);
    polyRef.current=L.polyline(ll,{color:'#6366F1',weight:5,opacity:0.85}).addTo(map);

    const mkIcon=(color,label)=>L.divIcon({
      html:`<div style="width:28px;height:28px;border-radius:50%;background:${color};border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:700;font-family:system-ui">${label}</div>`,
      iconSize:[28,28],iconAnchor:[14,14],className:''
    });
    const popupEl=label=>{const el=document.createElement('div');el.textContent=label;return el};

    if(points && points.length){
      points.forEach(p=>{
        if(p.lat != null && p.lon != null){
          const m=L.marker([p.lat,p.lon],{icon:mkIcon(p.color||'#6366F1',p.label)}).addTo(map);
          m.bindPopup(popupEl(p.name));
          markersRef.current.push(m);
        }
      });
    }

    if(polyRef.current && polyRef.current.getBounds().isValid()){
      map.fitBounds(polyRef.current.getBounds(),{padding:[30,30]});
    }
  },[coords,points]);

  return(
    <div className={`map-layer${isActive?' visible':''}`}>
      <div className="map-outer">
        <div ref={containerRef} className="map-leaflet"/>
        {(!coords||!coords.length)&&(
          <div className="map-empty" style={{position:'absolute',inset:0,background:'var(--surface)',backdropFilter:'blur(4px)'}}>
            <Icon name="map" size={48}/>
            <span style={{fontSize:14,fontWeight:600}}>{t.mapNoRoute}</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ── RouteView ─────────────────────────────────────────────────────────────────
function RouteView({date,setDate,start,setStart,stops,setStops,closeLoop,setCloseLoop,odoStart,setOdoStart,odoEnd,setOdoEnd,vehicles,selectedVehicleId,setSelectedVehicleId,onCalculate,calculating,t,setFlashMsg}){
  const[geolocating,setGeolocating]=useState(false);
  const[optimizing,setOptimizing]=useState(false);
  const[showBulk,setShowBulk]=useState(false);
  const[templates,setTemplates]=useState(loadTemplates);
  const[templateName,setTemplateName]=useState('');
  const[showTmplSave,setShowTmplSave]=useState(false);
  const[autoOdoApplied,setAutoOdoApplied]=useState(false);
  const dragIdx=useRef(null);
  const[dragOverId,setDragOverId]=useState(null);

  const newStop=()=>({id:uid(),text:'',lat:null,lon:null,display:''});
  const updateStop=(id,patch)=>setStops(p=>p.map(s=>s.id===id?{...s,...patch}:s));
  const removeStop=id=>setStops(p=>p.filter(s=>s.id!==id));

  // Auto-chain odometer from latest saved trip for this vehicle
  useEffect(()=>{
    if(!selectedVehicleId)return;
    const hist=loadHistory();
    const latest=hist.find(h=>(h.vehicleId===selectedVehicleId||h.vehicle===selectedVehicleId)&&h.odoEnd);
    if(latest && (!odoStart || autoOdoApplied)){
      setOdoStart(String(latest.odoEnd));
      setAutoOdoApplied(true);
    }
  },[selectedVehicleId]);

  const handleGeolocate=()=>{
    if(!navigator.geolocation)return;
    setGeolocating(true);
    navigator.geolocation.getCurrentPosition(async pos=>{
      const{latitude:lat,longitude:lon}=pos.coords;
      const res=await apiReverse(lat,lon);
      if(res){setStart({text:res.display,lat:res.lat,lon:res.lon,display:res.display})}
      setGeolocating(false);
    },()=>setGeolocating(false),{timeout:10000});
  };

  // Optimize route order using TSP 2-Opt
  const handleOptimize=async()=>{
    const validStops=stops.filter(s=>s&&s.text&&s.text.trim().length>=2);
    if(validStops.length<2){
      setFlashMsg?.(t.errNoStop ? t.errNoStop('min. 2') : 'Adaugă minim 2 opriri pentru optimizare');
      return;
    }
    setOptimizing(true);
    try{
      let resStart=start;
      if(!resStart.lat||!resStart.lon){
        const g=await apiGeocode(resStart.text);
        if(g.length)resStart={...resStart,lat:g[0].lat,lon:g[0].lon,display:g[0].display};
        setStart(resStart);
      }
      const resStops=[];
      for(const s of validStops){
        if(s.lat&&s.lon){
          resStops.push(s);
        } else {
          const g=await apiGeocode(s.text);
          if(g.length){
            resStops.push({...s,lat:g[0].lat,lon:g[0].lon,display:g[0].display});
          } else {
            resStops.push(s);
          }
        }
      }
      setStops(resStops);
      const opt=await apiOptimizeRoute(resStart,resStops,closeLoop);
      if(opt&&opt.orderedStops){
        setStops(opt.orderedStops);
        if(opt.savings_km>0){
          setFlashMsg?.(t.msgOptimized(opt.savings_km,opt.savings_pct));
        } else {
          setFlashMsg?.(t.badgeCalculated);
        }
      }
    }catch(e){
      setFlashMsg?.('Eroare optimizare: '+(e.message||e));
    }
    setOptimizing(false);
  };

  const handleBulkApply=(lines)=>{
    const added=lines.map(line=>({id:uid(),text:line,lat:null,lon:null,display:line}));
    setStops(prev=>[...prev.filter(s=>s.text&&s.text.trim().length>0),...added]);
  };

  const handleSaveTemplate=()=>{
    if(!start.text&&!stops.length)return;
    const name=templateName.trim()||`Traseu ${new Date().toLocaleDateString()}`;
    const updated=[{id:uid(),name,start,stops,vehicleId:selectedVehicleId},...templates.filter(x=>x.name!==name)];
    setTemplates(updated);
    saveTemplates(updated);
    setTemplateName('');
    setShowTmplSave(false);
    setFlashMsg?.(t.templateSaved);
  };

  const handleLoadTemplate=tmplId=>{
    const tmpl=templates.find(x=>x.id===tmplId);
    if(!tmpl)return;
    if(tmpl.start)setStart(tmpl.start);
    if(tmpl.stops)setStops(tmpl.stops.map(s=>({...s,id:uid()})));
    if(tmpl.vehicleId)setSelectedVehicleId(tmpl.vehicleId);
  };

  // Drag handlers
  const onDragStart=(e,id)=>{dragIdx.current=id;e.dataTransfer.effectAllowed='move'};
  const onDragOver=(e,id)=>{e.preventDefault();setDragOverId(id)};
  const onDrop=(e,targetId)=>{
    e.preventDefault();
    if(!dragIdx.current||dragIdx.current===targetId)return;
    setStops(prev=>{
      const arr=[...prev];
      const from=arr.findIndex(s=>s.id===dragIdx.current);
      const to=arr.findIndex(s=>s.id===targetId);
      const[item]=arr.splice(from,1);arr.splice(to,0,item);return arr;
    });
    dragIdx.current=null;setDragOverId(null);
  };
  const onDragEnd=()=>{dragIdx.current=null;setDragOverId(null)};

  return(
    <div className="view">
      {showBulk&&<BulkPasteModal onApply={handleBulkApply} onClose={()=>setShowBulk(false)} t={t}/>}

      {/* Route Templates Bar */}
      <div className="card" style={{padding:'12px 16px',marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
          <div style={{display:'flex',alignItems:'center',gap:6,fontSize:13,fontWeight:600,color:'var(--text-2)'}}>
            <Icon name="star" size={14}/> {t.templateTitle}
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            {templates.length>0&&(
              <select onChange={e=>handleLoadTemplate(e.target.value)} defaultValue="" style={{fontSize:12,padding:'4px 8px',borderRadius:6,border:'1px solid var(--border)',background:'var(--surface)',color:'var(--text-1)'}}>
                <option value="" disabled>{t.btnLoadTemplate} ({templates.length})</option>
                {templates.map(tmp=><option key={tmp.id} value={tmp.id}>{tmp.name}</option>)}
              </select>
            )}
            <button className="btn btn-outline btn-sm" onClick={()=>setShowTmplSave(!showTmplSave)} style={{fontSize:11,height:28,padding:'0 8px'}}>
              <Icon name="save" size={12}/> {t.btnSaveTemplate}
            </button>
          </div>
        </div>
        {showTmplSave&&(
          <div style={{display:'flex',gap:6,marginTop:8}}>
            <input type="text" value={templateName} onChange={e=>setTemplateName(e.target.value)} placeholder="ex: Livrare București Nord" style={{flex:1,fontSize:13,padding:'6px 10px'}}/>
            <button className="btn btn-primary btn-sm" onClick={handleSaveTemplate} style={{width:'auto',height:34}}>{t.btnSaveVehicle}</button>
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-title"><span className="card-title-dot"/>{t.sectionDate}</div>
        <div className="field"><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
      </div>

      {vehicles.length>0&&(
        <div className="card">
          <div className="card-title"><span className="card-title-dot"/>{t.sectionVehicle}</div>
          <div className="field">
            <select value={selectedVehicleId} onChange={e=>setSelectedVehicleId(e.target.value)}>
              <option value="">{t.noVehicle}</option>
              {vehicles.map(v=><option key={v.id} value={v.id}>{v.name}{v.plate?` · ${v.plate}`:''}</option>)}
            </select>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-title">
          <span className="card-title-dot"/>
          <span style={{flex:1}}>{t.sectionStart}</span>
          <button className="btn-geo" onClick={handleGeolocate} disabled={geolocating}>
            <Icon name="gps" size={13}/>{geolocating?t.geolocating:t.btnGeolocate}
          </button>
        </div>
        <AddressInput value={start.text} display={start.display}
          onTextChange={v=>setStart(p=>({...p,text:v,lat:null,lon:null,display:''}))}
          onSelect={c=>setStart({text:c.display,lat:c.lat,lon:c.lon,display:c.display})}
          placeholder={t.placeholderStart}/>
      </div>

      <div className="card">
        <div className="card-title">
          <span className="card-title-dot"/>
          <span style={{flex:1}}>{t.sectionStops} · {stops.length}</span>
          <button className="btn btn-outline btn-sm" onClick={handleOptimize} disabled={stops.length<2||optimizing} title="Optimizează ordinea opririlor pentru km minimi (TSP)" style={{width:'auto',height:30,padding:'0 10px',fontSize:12,borderColor:'var(--accent)',color:'var(--accent)'}}>
            <Icon name="zap" size={13}/>{optimizing?t.btnOptimizing:t.btnOptimize}
          </button>
        </div>
        {stops.map((s,i)=>(
          <div key={s.id}
            className={`stop-item${dragOverId===s.id?' drag-over':''}`}
            draggable
            onDragStart={e=>onDragStart(e,s.id)}
            onDragOver={e=>onDragOver(e,s.id)}
            onDrop={e=>onDrop(e,s.id)}
            onDragEnd={onDragEnd}>
            <div className="stop-header">
              <span className="stop-label">
                <span className="drag-handle"><Icon name="grip" size={16}/></span>
                <span className="stop-num">{i+1}</span>{t.stopLabel}
              </span>
              <div className="stop-actions" style={{display:'flex',alignItems:'center',gap:4}}>
                {(s.display||s.text)&&(
                  <>
                    <a href={`https://waze.com/ul?q=${encodeURIComponent(s.display||s.text)}&navigate=yes`} target="_blank" rel="noopener noreferrer" className="btn-nav-app btn-waze" title="Deschide în Waze" style={{height:24,padding:'0 6px',fontSize:10}}>
                      <Icon name="waze" size={12}/> Waze
                    </a>
                    <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.display||s.text)}`} target="_blank" rel="noopener noreferrer" className="btn-nav-app btn-gmaps" title="Deschide în Google Maps" style={{height:24,padding:'0 6px',fontSize:10}}>
                      <Icon name="externalLink" size={11}/> Maps
                    </a>
                  </>
                )}
                <button className="btn-icon" disabled={i===0} onClick={()=>setStops(p=>{const a=[...p];[a[i],a[i-1]]=[a[i-1],a[i]];return a})} aria-label="Sus"><Icon name="arrowUp" size={14}/></button>
                <button className="btn-icon" disabled={i===stops.length-1} onClick={()=>setStops(p=>{const a=[...p];[a[i],a[i+1]]=[a[i+1],a[i]];return a})} aria-label="Jos"><Icon name="arrowDown" size={14}/></button>
                <button className="btn-icon danger" onClick={()=>removeStop(s.id)} aria-label="Șterge"><Icon name="x" size={14}/></button>
              </div>
            </div>
            <AddressInput value={s.text} display={s.display}
              onTextChange={v=>updateStop(s.id,{text:v,lat:null,lon:null,display:''})}
              onSelect={c=>updateStop(s.id,{text:c.display,lat:c.lat,lon:c.lon,display:c.display})}
              placeholder={t.placeholderStop}/>
          </div>
        ))}
        <div style={{display:'flex',gap:8,marginTop:8}}>
          <button className="btn-add-stop" style={{flex:1}} onClick={()=>setStops(p=>[...p,newStop()])}>
            <Icon name="plus" size={16}/>{t.btnAddStop}
          </button>
          <button className="btn btn-outline" style={{width:'auto',padding:'0 16px',height:46}} onClick={()=>setShowBulk(true)} title={t.btnBulkPaste}>
            <Icon name="clipboard" size={16}/>
          </button>
        </div>
      </div>

      <div className="card">
        <div className="card-title"><span className="card-title-dot"/>{t.sectionOptions}</div>
        <Toggle checked={closeLoop} onChange={setCloseLoop} label={t.optionReturn}/>
      </div>

      <div className="card">
        <div className="card-title">
          <span className="card-title-dot"/>
          <span>{t.sectionOdometer}</span>
          {autoOdoApplied&&<span style={{fontSize:11,color:'var(--accent)',fontWeight:600,marginLeft:'auto'}}>{t.odoAutoHint}</span>}
        </div>
        <div className="odo-row">
          <div className="field" style={{marginBottom:0}}>
            <label>{t.odoStart}</label>
            <input type="number" value={odoStart} onChange={e=>{setOdoStart(e.target.value);setAutoOdoApplied(false)}} placeholder="ex: 12345" min="0"/>
          </div>
          <div className="field" style={{marginBottom:0}}>
            <label>{t.odoEnd}</label>
            <input type="number" value={odoEnd} onChange={e=>setOdoEnd(e.target.value)} placeholder="ex: 12390" min="0"/>
          </div>
        </div>
      </div>

      <div style={{marginBottom:16}}>
        <button className="btn btn-primary" onClick={onCalculate} disabled={calculating}>
          {calculating?t.btnCalculating:<><Icon name="map" size={18}/>{t.btnCalculate}</>}
        </button>
      </div>
    </div>
  );
}

// ── SegmentsView ──────────────────────────────────────────────────────────────
function SegmentsView({segments,segOpts,setSegOpts,vehicles,selectedVehicleId,onGoRoute,onSaveHistory,t}){
  const vehicle=vehicles.find(v=>v.id===selectedVehicleId)||null;
  const[arrivalTime,setArrivalTime]=useState('');
  const[stopMin,setStopMin]=useState('');

  if(!segments.length){
    return(
      <div className="view">
        <div className="empty-state">
          <div className="empty-icon"><Icon name="map" size={32}/></div>
          <div className="empty-title">{t.emptySegmentsTitle}</div>
          <div className="empty-sub">{t.emptySegmentsSub}</div>
          <div style={{marginTop:22}}><button className="btn btn-outline" style={{width:'auto',padding:'0 28px'}} onClick={onGoRoute}>{t.goToRoute}</button></div>
        </div>
      </div>
    );
  }

  const updateOpt=(i,patch)=>setSegOpts(p=>p.map((o,j)=>j===i?{...o,...patch}:o));
  const total=segments.reduce((sum,seg,i)=>{
    const opt=segOpts[i]||{roundTrip:false,reps:1};
    return sum+kmRound(seg.km_oneway*(opt.roundTrip?2:1)*opt.reps);
  },0);

  const calcCost=km=>{
    if(!vehicle||!vehicle.consumption||!vehicle.fuelPrice)return null;
    return kmRound(km*parseFloat(vehicle.consumption)/100*parseFloat(vehicle.fuelPrice));
  };
  const totalCost=calcCost(total);

  // Carbon footprint estimate: ~2.39 kg CO2 per liter of fuel
  const lpk = vehicle?.consumption ? parseFloat(vehicle.consumption) : 7.0;
  const co2Kg = kmRound((total * lpk / 100) * 2.39);

  // ── Transport schedule (backward from final arrival time) ──
  const hasDurations=segments.every(s=>typeof s.min==='number');
  const stopMinNum=Math.max(0,parseInt(stopMin,10)||0);
  const arrivalMin=hhmmToMin(arrivalTime);
  let schedRows=null,driveMin=0,elapsedMin=0;
  if(hasDurations&&arrivalMin!=null){
    const n=segments.length;
    const names=[segments[0].from,...segments.map(s=>s.to)];
    const arrive=new Array(n+1);
    arrive[n]=arrivalMin;
    for(let k=n-1;k>=0;k--){
      const departK=arrive[k+1]-segments[k].min;
      arrive[k]=k===0?departK:departK-stopMinNum;
    }
    schedRows=[{kind:'depart',name:names[0],min:arrive[0]}];
    for(let k=1;k<n;k++){
      schedRows.push({kind:'arrive',name:names[k],min:arrive[k]});
      if(stopMinNum>0)schedRows.push({kind:'leave',name:names[k],min:arrive[k]+stopMinNum});
    }
    schedRows.push({kind:'final',name:names[n],min:arrive[n]});
    driveMin=segments.reduce((s,seg)=>s+seg.min,0);
    elapsedMin=arrive[n]-arrive[0];
  }
  const SchedTime=({m})=>{const f=minToHHMM(m);return(<span className="sched-time">{f.time}{f.off!==0&&<sup>{f.off>0?'+':''}{f.off}{t.dayShort}</sup>}</span>)};

  return(
    <div className="view">
      <div className="total-hero">
        <div className="total-hero-content">
          <div>
            <div className="total-label">{t.totalDistance}</div>
            <div><span className="total-value">{kmRound(total).toFixed(1)}</span><span className="total-unit">km</span></div>
            {totalCost!=null&&<div className="total-cost-sub">{t.totalCost}: {totalCost.toFixed(2)} RON</div>}
            {co2Kg>0&&(
              <div style={{marginTop:8,display:'inline-flex',alignItems:'center',gap:6,background:'rgba(16,185,129,0.12)',color:'#10B981',padding:'3px 10px',borderRadius:20,fontSize:12,fontWeight:600}}>
                <Icon name="leaf" size={13}/> {t.co2Emissions}: ~{co2Kg.toFixed(1)} kg CO₂
              </div>
            )}
          </div>
          <div className="total-hero-icon"><Icon name="car" size={26}/></div>
        </div>
      </div>

      {/* External Navigation Shortcuts */}
      <div className="card" style={{padding:'12px 16px',marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:600,color:'var(--text-2)',marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
          <Icon name="externalLink" size={14}/> {t.navigationTitle}
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <a href={`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(segments[0].from)}&destination=${encodeURIComponent(segments[segments.length-1].to)}&waypoints=${encodeURIComponent(segments.slice(0,-1).map(s=>s.to).join('|'))}`} target="_blank" rel="noopener noreferrer" className="btn btn-outline btn-sm btn-gmaps" style={{flex:1,minWidth:140,textDecoration:'none',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6}}>
            <Icon name="externalLink" size={14}/> {t.openGoogleMaps}
          </a>
          <a href={`https://waze.com/ul?q=${encodeURIComponent(segments[0].to)}&navigate=yes`} target="_blank" rel="noopener noreferrer" className="btn btn-outline btn-sm btn-waze" style={{flex:1,minWidth:140,textDecoration:'none',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6}}>
            <Icon name="waze" size={14}/> {t.openWaze}
          </a>
        </div>
      </div>

      <div className="sched-card">
        <div className="sched-title"><Icon name="clock" size={16}/>{t.scheduleTitle}</div>
        <div className="sched-inputs">
          <div className="field"><label>{t.scheduleArrival}</label><input type="time" value={arrivalTime} onChange={e=>setArrivalTime(e.target.value)}/></div>
          <div className="field"><label>{t.scheduleStopTime}</label><input type="number" min="0" step="5" value={stopMin} placeholder="0" onChange={e=>setStopMin(e.target.value)}/></div>
        </div>
        {!hasDurations?(
          <div className="sched-note">{t.scheduleNoData}</div>
        ):schedRows?(
          <div className="sched-timeline">
            {schedRows.map((r,i)=>{
              const accent=r.kind==='depart'||r.kind==='final';
              const label=r.kind==='arrive'||r.kind==='final'?t.scheduleArrive:t.scheduleDepart;
              return(
                <div key={i} className={`sched-row${accent?' accent':''}`}>
                  <SchedTime m={r.min}/>
                  <div className={`sched-marker${accent?' fill':''}`}/>
                  <div className="sched-body">
                    <div className="sched-label">{label}</div>
                    <div className="sched-name">{r.name}</div>
                  </div>
                </div>
              );
            })}
            <div className="sched-foot"><span>{t.scheduleDrive}: <b>{fmtDur(driveMin)}</b></span><span>{t.scheduleElapsed}: <b>{fmtDur(elapsedMin)}</b></span></div>
          </div>
        ):(
          <div className="sched-note">{t.scheduleHint}</div>
        )}
      </div>

      {segments.map((seg,i)=>{
        const opt=segOpts[i]||{roundTrip:false,reps:1,purpose:''};
        const km=kmRound(seg.km_oneway*(opt.roundTrip?2:1)*opt.reps);
        const cost=calcCost(km);
        return(
          <div key={i} className="seg-card">
            <div className="seg-route">
              <div className="seg-dots"><div className="dot dot-start"/><div className="dot-line"/><div className="dot dot-end"/></div>
              <div className="seg-addrs">
                <div className="seg-from">{seg.from}</div>
                <div className="seg-to">{seg.to}</div>
              </div>
            </div>
            <div className="seg-divider"/>
            <div className="seg-controls">
              <div>
                <div className="seg-km">{km.toFixed(1)} km</div>
                <div className="seg-km-sub">{seg.km_oneway} km × {opt.reps}{opt.roundTrip?` × 2 (${t.roundTrip.toLowerCase()})`:''}</div>
                {cost!=null&&<div className="cost-tag"><Icon name="fuel" size={10}/>{cost.toFixed(2)} RON</div>}
              </div>
              <div className="seg-opts">
                <Toggle checked={opt.roundTrip} onChange={v=>updateOpt(i,{roundTrip:v})} label={t.roundTrip}/>
                <div className="seg-opts-row"><span>{t.multiplier}</span><Stepper value={opt.reps} onChange={v=>updateOpt(i,{reps:v})}/></div>
              </div>
            </div>
            <input type="text" className="purpose-input" value={opt.purpose||''} onChange={e=>updateOpt(i,{purpose:e.target.value})} placeholder={`${t.purposeLabel}: ${t.purposePlaceholder}`}/>
          </div>
        );
      })}

      <div style={{marginBottom:16}}>
        <button className="btn btn-primary" onClick={onSaveHistory}>
          <Icon name="save" size={18}/>{t.btnSaveHistory}
        </button>
      </div>
    </div>
  );
}

// ── FuelView ──────────────────────────────────────────────────────────────────
function FuelView({vehicles,selectedVehicleId,fuelLogs,setFuelLogs,company,t,flash}){
  const blank={id:'',date:today(),vehicleId:selectedVehicleId||(vehicles[0]?.id||''),receiptNo:'',vendor:'Petrom',fuelType:'Motorină Standard',liters:'',pricePerLiter:'',amount:'',odometer:''};
  const[form,setForm]=useState(blank);
  const[exporting,setExporting]=useState(false);

  useEffect(()=>{
    if(selectedVehicleId && !form.vehicleId){
      setForm(p=>({...p,vehicleId:selectedVehicleId}));
    }
  },[selectedVehicleId]);

  const set=k=>e=>{
    const v=e.target.value;
    setForm(p=>{
      const next={...p,[k]:v};
      if(k==='liters'||k==='pricePerLiter'){
        const l=parseFloat(k==='liters'?v:next.liters);
        const pr=parseFloat(k==='pricePerLiter'?v:next.pricePerLiter);
        if(!isNaN(l)&&!isNaN(pr)&&l>0&&pr>0){
          next.amount=(l*pr).toFixed(2);
        }
      }
      return next;
    });
  };

  const handleSave=()=>{
    if(!form.liters||parseFloat(form.liters)<=0)return;
    const entry={
      ...form,
      id:form.id||uid(),
      liters:parseFloat(form.liters)||0,
      pricePerLiter:parseFloat(form.pricePerLiter)||0,
      amount:parseFloat(form.amount)||0,
      odometer:form.odometer?parseInt(form.odometer,10):null,
      createdAt:new Date().toISOString(),
    };
    const updated=[entry,...fuelLogs.filter(x=>x.id!==entry.id)];
    setFuelLogs(updated);
    saveFuelLogs(updated);
    setForm({...blank,vehicleId:selectedVehicleId||(vehicles[0]?.id||'')});
    flash(t.fuelLogSaved);
  };

  const handleDelete=id=>{
    if(window.confirm(t.deleteConfirm||'Sigur dorești să ștergi acest bon?')){
      const updated=fuelLogs.filter(x=>x.id!==id);
      setFuelLogs(updated);
      saveFuelLogs(updated);
    }
  };

  const handleExport=async()=>{
    if(!fuelLogs.length)return;
    setExporting(true);
    try{
      await apiExportFuel(fuelLogs,company);
      flash(t.msgExcel);
    }catch(e){
      flash('Eroare export: '+e.message);
    }
    setExporting(false);
  };

  const totalSpent=fuelLogs.reduce((s,f)=>s+(f.amount||0),0);
  const totalLiters=fuelLogs.reduce((s,f)=>s+(f.liters||0),0);

  return(
    <div className="view">
      <div className="stats-grid">
        <div className="stat-box">
          <div className="stat-box-val">{fuelLogs.length}</div>
          <div className="stat-box-lbl">{t.fuelReceiptsCount}</div>
        </div>
        <div className="stat-box">
          <div className="stat-box-val">{totalLiters.toFixed(1)} L</div>
          <div className="stat-box-lbl">{t.fuelTotalLiters}</div>
        </div>
        <div className="stat-box">
          <div className="stat-box-val">{totalSpent.toFixed(0)} <span style={{fontSize:13}}>RON</span></div>
          <div className="stat-box-lbl">{t.fuelTotalSpent}</div>
        </div>
      </div>

      <div className="card">
        <div className="card-title">
          <span className="card-title-dot"/>
          <span>{t.fuelAddReceipt}</span>
        </div>
        <div className="field-row">
          <div className="field"><label>{t.fuelDate}</label><input type="date" value={form.date} onChange={set('date')}/></div>
          <div className="field"><label>{t.sectionVehicle}</label>
            <select value={form.vehicleId} onChange={set('vehicleId')}>
              <option value="">{t.noVehicle}</option>
              {vehicles.map(v=><option key={v.id} value={v.id}>{v.name}{v.plate?` · ${v.plate}`:''}</option>)}
            </select>
          </div>
        </div>
        <div className="field-row">
          <div className="field"><label>{t.fuelReceiptNo}</label><input type="text" value={form.receiptNo} onChange={set('receiptNo')} placeholder="ex: 1042 / BON-09"/></div>
          <div className="field"><label>{t.fuelVendor}</label><input type="text" value={form.vendor} onChange={set('vendor')} placeholder="ex: OMV, Petrom, Rompetrol, MOL"/></div>
        </div>
        <div className="field-row">
          <div className="field"><label>{t.fuelType}</label>
            <select value={form.fuelType} onChange={set('fuelType')}>
              <option value="Motorină Standard">Motorină Standard</option>
              <option value="Motorină Premium">Motorină Premium</option>
              <option value="Benzină 95">Benzină 95</option>
              <option value="Benzină 98/100">Benzină 98/100</option>
              <option value="GPL">GPL</option>
              <option value="Electricitate">Electricitate (kWh)</option>
            </select>
          </div>
          <div className="field"><label>{t.fuelOdoAtRefill}</label><input type="number" value={form.odometer} onChange={set('odometer')} placeholder="ex: 125000" min="0"/></div>
        </div>
        <div className="field-row">
          <div className="field"><label>{t.fuelLiters}</label><input type="number" step="0.01" value={form.liters} onChange={set('liters')} placeholder="ex: 50.00" min="0"/></div>
          <div className="field"><label>{t.fuelPricePerLiter}</label><input type="number" step="0.01" value={form.pricePerLiter} onChange={set('pricePerLiter')} placeholder="ex: 7.35" min="0"/></div>
          <div className="field"><label>{t.fuelAmount}</label><input type="number" step="0.01" value={form.amount} onChange={set('amount')} placeholder="ex: 367.50" min="0"/></div>
        </div>
        <button className="btn btn-primary" style={{marginTop:6,height:44}} onClick={handleSave}>
          <Icon name="plus" size={16}/>{t.btnSaveFuel}
        </button>
      </div>

      <div className="card">
        <div className="card-title" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{display:'flex',alignItems:'center',gap:8}}><span className="card-title-dot"/>{t.fuelHistoryTitle} · {fuelLogs.length}</span>
          {fuelLogs.length>0&&(
            <button className="btn btn-outline btn-sm" onClick={handleExport} disabled={exporting} style={{fontSize:12,padding:'0 10px',height:30}}>
              <Icon name="sheet" size={14}/> {t.btnExportFuel}
            </button>
          )}
        </div>
        {fuelLogs.length===0?(
          <div style={{textAlign:'center',padding:'24px 0',color:'var(--text-3)',fontSize:14}}>
            {t.fuelEmpty}
          </div>
        ):(
          fuelLogs.map(f=>{
            const veh=vehicles.find(v=>v.id===f.vehicleId);
            return(
              <div key={f.id} className="history-item" style={{marginBottom:10}}>
                <div className="history-header" style={{cursor:'default'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="history-date">{fmtDate(f.date)} · <span style={{fontWeight:600,color:'var(--text-1)'}}>{f.vendor||'Benzinărie'}</span> {f.receiptNo?`(#${f.receiptNo})`:''}</div>
                    <div className="history-vehicle">{[veh?.name,veh?.plate,f.fuelType,f.odometer?`${f.odometer} km`:null].filter(Boolean).join(' · ')}</div>
                  </div>
                  <div style={{textAlign:'right',marginRight:10}}>
                    <div className="history-km">{f.amount ? f.amount.toFixed(2) : '0.00'} RON</div>
                    <div className="history-cost">{f.liters ? f.liters.toFixed(2) : '0'} L {f.pricePerLiter?`(@ ${f.pricePerLiter} RON/L)`:''}</div>
                  </div>
                  <button className="btn-icon danger" onClick={()=>handleDelete(f.id)} title="Șterge bon"><Icon name="trash" size={14}/></button>
                </div>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

// ── ExportView ────────────────────────────────────────────────────────────────
function ExportView({segments,segOpts,date,start,stops,vehicles,selectedVehicleId,setStart,setStops,setSegments,setSegOpts,setTab,company,odoStart,odoEnd,fuelLogs,t,lang}){
  const[favName,setFavName]=useState('');
  const[favorites,setFavorites]=useState(()=>{try{return JSON.parse(localStorage.getItem('fp_favorites')||'{}')}catch{return{}}});
  const[exporting,setExporting]=useState(false);
  const[msg,setMsg]=useState('');
  const[selMonth,setSelMonth]=useState('');
  const history=loadHistory();
  const vehicle=vehicles.find(v=>v.id===selectedVehicleId)||null;

  const saveFavs=obj=>{setFavorites(obj);localStorage.setItem('fp_favorites',JSON.stringify(obj))};
  const total=segments.reduce((sum,seg,i)=>{const opt=segOpts[i]||{roundTrip:false,reps:1};return sum+kmRound(seg.km_oneway*(opt.roundTrip?2:1)*opt.reps)},0);
  const dateStr=date.replace(/-/g,'');

  const buildRows=()=>segments.map((seg,i)=>{
    const opt=segOpts[i]||{roundTrip:false,reps:1,purpose:''};
    const km=kmRound(seg.km_oneway*(opt.roundTrip?2:1)*opt.reps);
    return{[t.colDate]:fmtDate(date),[t.colFrom]:seg.from,[t.colTo]:seg.to,[t.colPurpose]:opt.purpose||'',[t.colRoundTrip]:opt.roundTrip?t.yes:t.no,[t.colReps]:opt.reps,[t.colKm]:km};
  });

  const flash=m=>{setMsg(m);setTimeout(()=>setMsg(''),3500)};

  const handleCSV=()=>{if(!segments.length)return;exportCSV(buildRows(),dateStr);flash(t.msgCSV)};
  const handleExcel=async()=>{
    if(!segments.length)return;
    setExporting(true);
    try{
      await apiExportExcel(buildRows(),total,dateStr,t.colTotal,company,vehicle?`${vehicle.name} ${vehicle.plate||''}`.trim():'',vehicle?.driver||'',odoStart,odoEnd,fuelLogs);
      flash(t.msgExcel);
    }catch(e){
      flash('Eroare: '+e.message);
    }
    setExporting(false);
  };
  const handlePDF=async()=>{
    if(!segments.length)return;
    setExporting(true);
    try{
      await apiExportPDF(buildRows(),total,dateStr,t.appTitle,vehicle?`${vehicle.name} ${vehicle.plate||''}`.trim():'',vehicle?.driver||'',t.colTotal,company,odoStart,odoEnd,fuelLogs);
      flash(t.msgPDF);
    }catch(e){
      flash('Eroare: '+e.message);
    }
    setExporting(false);
  };

  const handleShare=async()=>{
    const enc=encodeRoute(start,stops);
    if(!enc)return;
    const url=`${window.location.origin}${window.location.pathname}?route=${enc}`;
    try{await navigator.clipboard.writeText(url);flash(t.msgLinkCopied)}catch{flash(url)}
  };

  const handleSaveFav=()=>{
    const name=favName.trim()||`traseu-${new Date().toISOString().slice(0,16).replace('T','-').replace(':','')}`;
    saveFavs({...favorites,[name]:{start:{text:start.text,display:start.display},stops:stops.map(s=>({text:s.text,display:s.display}))}});
    setFavName('');flash(t.msgFavSaved(name));
  };
  const handleLoadFav=name=>{
    const p=favorites[name];if(!p)return;
    setStart({text:p.start.display||p.start.text,lat:null,lon:null,display:p.start.display||p.start.text});
    setStops((p.stops||[]).map(s=>({id:uid(),text:s.display||s.text,lat:null,lon:null,display:s.display||s.text})));
    setSegments([]);setSegOpts([]);setTab('route');
  };
  const handleDeleteFav=name=>{const c={...favorites};delete c[name];saveFavs(c)};
  const handleExportFavs=()=>{const blob=new Blob([JSON.stringify(favorites,null,2)],{type:'application/json'});_downloadBlob(blob,'favorite_trasee.json')};
  const handleImportFavs=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const obj=JSON.parse(ev.target.result);
        if(obj && typeof obj==='object' && !Array.isArray(obj)){
          saveFavs({...favorites,...obj});
          flash(t.msgImported);
        } else {
          flash(t.msgInvalidFile);
        }
      }catch{flash(t.msgInvalidFile)}
    };
    reader.readAsText(file);
    e.target.value='';
  };

  // Monthly report
  const months=[...new Set(history.map(h=>h.date.slice(0,7)))].sort().reverse();
  const filteredHist=selMonth?history.filter(h=>h.date.startsWith(selMonth)):[];
  const monthlyRows=filteredHist.flatMap(h=>(h.segments||[]).map((seg,i)=>{
    const opt=(h.segOpts||[])[i]||{};
    const km=seg.km != null ? seg.km : (seg.km_oneway ? kmRound(seg.km_oneway*(opt.roundTrip?2:1)*(opt.reps||1)) : 0);
    const purpose=seg.purpose || opt.purpose || '';
    const roundTrip=seg.roundTrip ?? opt.roundTrip ?? false;
    const reps=seg.reps ?? opt.reps ?? 1;
    return{[t.colDate]:fmtDate(h.date),[t.colFrom]:seg.from,[t.colTo]:seg.to,[t.colPurpose]:purpose,[t.colRoundTrip]:roundTrip?t.yes:t.no,[t.colReps]:reps,[t.colKm]:km};
  }));
  const monthlyTotal=filteredHist.reduce((s,h)=>s+(h.totalKm ?? h.total_km ?? 0),0);

  const handleMonthlyExcel=async()=>{
    if(!monthlyRows.length)return;
    setExporting(true);
    const vehLabel=vehicle?`${vehicle.name} ${vehicle.plate||''}`.trim():'';
    const drvLabel=vehicle?.driver||'';
    try{
      await apiExportExcel(monthlyRows,monthlyTotal,selMonth.replace('-',''),t.colTotal,company,vehLabel,drvLabel,null,null,fuelLogs);
      flash(t.msgExcel);
    }catch(e){
      flash('Eroare: '+e.message);
    }
    setExporting(false);
  };

  const handleMonthlyPDF=async()=>{
    if(!monthlyRows.length)return;
    setExporting(true);
    const vehLabel=vehicle?`${vehicle.name} ${vehicle.plate||''}`.trim():'';
    const drvLabel=vehicle?.driver||'';
    try{
      await apiExportPDF(monthlyRows,monthlyTotal,selMonth.replace('-',''),`${t.appTitle} - ${fmtMonth(selMonth)}`,vehLabel,drvLabel,t.colTotal,company,null,null,fuelLogs);
      flash(t.msgPDF);
    }catch(e){
      flash('Eroare: '+e.message);
    }
    setExporting(false);
  };

  const favList=Object.keys(favorites);
  const isErr=m=>m.startsWith('Eroare')||m.includes('invalid')||m.includes('Invalid');

  return(
    <div className="view">
      {msg&&<div className={`alert ${isErr(msg)?'alert-error':'alert-success'}`}>{msg}</div>}

      {segments.length>0&&(<>
        <div className="total-hero">
          <div className="total-hero-content">
            <div>
              <div className="total-label">{t.totalCalculated}</div>
              <div><span className="total-value">{kmRound(total).toFixed(1)}</span><span className="total-unit">km</span></div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button className="theme-toggle" onClick={handleShare} title={t.btnShareRoute}><Icon name="share" size={17}/></button>
              <div className="total-hero-icon"><Icon name="download" size={24}/></div>
            </div>
          </div>
        </div>

        <div className="card">
          <div className="card-title"><span className="card-title-dot"/>{t.sectionDownload}</div>
          <div className="export-grid-3">
            <button className="btn btn-outline" onClick={handleCSV}><Icon name="file" size={16}/>{t.btnCSV}</button>
            <button className="btn btn-outline" onClick={handleExcel} disabled={exporting}>{exporting?'...': <><Icon name="sheet" size={16}/>{t.btnExcel}</>}</button>
            <button className="btn btn-outline" onClick={handlePDF} disabled={exporting}>{exporting?'...':<><Icon name="file" size={16}/>{t.btnPDF}</>}</button>
          </div>
        </div>
      </>)}

      <div className="card">
        <div className="card-title"><span className="card-title-dot"/>{t.sectionMonthly}</div>
        <div className="field" style={{marginBottom:10}}>
          <select value={selMonth} onChange={e=>setSelMonth(e.target.value)}>
            <option value="">{t.selectMonth}</option>
            {months.map(m=><option key={m} value={m}>{fmtMonth(m)}</option>)}
          </select>
        </div>
        {selMonth&&<div style={{fontSize:13,color:'var(--text-3)',marginBottom:10}}>{filteredHist.length} {t.tripsCount} · {kmRound(monthlyTotal).toFixed(1)} km</div>}
        <div className="export-grid" style={{marginTop:8}}>
          <button className="btn btn-outline btn-sm" onClick={handleMonthlyExcel} disabled={!selMonth||!monthlyRows.length||exporting}>
            <Icon name="sheet" size={14}/>{t.btnExcel} {t.sectionMonthly}
          </button>
          <button className="btn btn-outline btn-sm" onClick={handleMonthlyPDF} disabled={!selMonth||!monthlyRows.length||exporting}>
            <Icon name="file" size={14}/>{t.btnPDF} {t.sectionMonthly}
          </button>
        </div>
      </div>

      <div className="card">
        <div className="card-title"><span className="card-title-dot"/>{t.sectionFavorites}</div>
        {segments.length>0&&(<>
          <div className="field"><label>{t.labelFavName}</label><input type="text" value={favName} onChange={e=>setFavName(e.target.value)} placeholder={t.placeholderFavName}/></div>
          <button className="btn btn-outline btn-sm" onClick={handleSaveFav} style={{marginBottom:12}}><Icon name="star" size={14}/>{t.btnSaveFav}</button>
        </>)}
        {favList.length>0?(<>
          {segments.length>0&&<div className="divider"/>}
          {favList.map(name=>(
            <div key={name} className="fav-item">
              <div className="fav-info"><div className="fav-name">{name}</div><div className="fav-stops">{favorites[name].start?.display?.slice(0,50)||'—'}</div></div>
              <button className="btn btn-outline btn-sm" style={{width:'auto'}} onClick={()=>handleLoadFav(name)}>{t.btnLoad}</button>
              <button className="btn-icon danger" onClick={()=>handleDeleteFav(name)}><Icon name="x" size={14}/></button>
            </div>
          ))}
          <div className="divider"/>
          <div className="export-grid">
            <button className="btn btn-outline btn-sm" onClick={handleExportFavs}><Icon name="download" size={14}/>{t.btnExportFav}</button>
            <label className="btn btn-outline btn-sm" style={{cursor:'pointer'}}><Icon name="upload" size={14}/>{t.btnImportFav}<input type="file" accept=".json" style={{display:'none'}} onChange={handleImportFavs}/></label>
          </div>
        </>):segments.length===0?(<div style={{textAlign:'center',padding:'20px 0',color:'var(--text-3)',fontSize:14}}>{t.noFavorites}</div>):null}
      </div>

      {segments.length===0&&favList.length===0&&(
        <div className="empty-state">
          <div className="empty-icon"><Icon name="download" size={32}/></div>
          <div className="empty-title">{t.emptyExportTitle}</div>
          <div className="empty-sub">{t.emptyExportSub}</div>
          <div style={{marginTop:22}}><button className="btn btn-outline" style={{width:'auto',padding:'0 28px'}} onClick={()=>setTab('route')}>{t.goToRoute}</button></div>
        </div>
      )}
    </div>
  );
}

// ── HistoryView ───────────────────────────────────────────────────────────────
function HistoryView({vehicles,setTab,company,fuelLogs,templates,t,flash}){
  const[history,setHistory]=useState(loadHistory);
  const[filterMonth,setFilterMonth]=useState('');
  const[searchQuery,setSearchQuery]=useState('');
  const[expanded,setExpanded]=useState({});
  const[subTab,setSubTab]=useState('trips');

  const months=[...new Set(history.map(h=>h.date.slice(0,7)))].sort().reverse();

  // Search & month filtering
  const filtered=history.filter(h=>{
    if(filterMonth && !h.date.startsWith(filterMonth)) return false;
    if(searchQuery.trim()){
      const q = searchQuery.toLowerCase();
      const matchVeh = (h.vehicle||'').toLowerCase().includes(q) || (h.driver||'').toLowerCase().includes(q);
      const matchSegs = (h.segments||[]).some(s=> (s.from||'').toLowerCase().includes(q) || (s.to||'').toLowerCase().includes(q) || (s.purpose||'').toLowerCase().includes(q));
      const matchDate = fmtDate(h.date).toLowerCase().includes(q);
      if(!matchVeh && !matchSegs && !matchDate) return false;
    }
    return true;
  });

  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date));

  const totalKm=sorted.reduce((s,h)=>s+(h.totalKm ?? h.total_km ?? 0),0);
  const totalCost=sorted.reduce((s,h)=>s+(h.totalCost ?? h.total_cost ?? 0),0);

  const deleteTrip=id=>{
    if(window.confirm(t.deleteConfirm || 'Sigur dorești să ștergi această cursă?')){
      const h=history.filter(x=>x.id!==id);
      saveHistory(h);setHistory(h);
    }
  };

  const toggle=id=>setExpanded(p=>({...p,[id]:!p[id]}));

  // Full backup & restore handlers
  const handleFullBackup=()=>{
    const data={
      version:'2.0',
      exportedAt:new Date().toISOString(),
      company:loadCompany(),
      vehicles:loadVehicles(),
      history:loadHistory(),
      fuelLogs:loadFuelLogs(),
      templates:loadTemplates(),
      favorites:(()=>{try{return JSON.parse(localStorage.getItem('fp_favorites')||'{}')}catch{return{}}})(),
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    _downloadBlob(blob,`backup_triplog_${today().replace(/-/g,'')}.json`);
    flash?.(t.backupSuccess);
  };

  const handleFullRestore=e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data && typeof data==='object'){
          if(Array.isArray(data.history)) { saveHistory(data.history); setHistory(data.history); }
          if(Array.isArray(data.vehicles)) saveVehicles(data.vehicles);
          if(Array.isArray(data.fuelLogs)) saveFuelLogs(data.fuelLogs);
          if(data.company) saveCompany(data.company);
          if(Array.isArray(data.templates)) saveTemplates(data.templates);
          if(data.favorites) localStorage.setItem('fp_favorites',JSON.stringify(data.favorites));
          flash?.(t.restoreSuccess);
        } else {
          flash?.(t.msgInvalidFile);
        }
      }catch(err){
        flash?.(t.msgInvalidFile);
      }
    };
    reader.readAsText(file);
    e.target.value='';
  };

  // Fleet analytics aggregations
  const vehicleStats={};
  vehicles.forEach(v=>{ vehicleStats[v.id]={name:v.name,plate:v.plate||'',km:0,trips:0,cost:0}; });
  history.forEach(h=>{
    const vid=h.vehicleId||'other';
    if(!vehicleStats[vid]) vehicleStats[vid]={name:h.vehicle||'Vehicul nespecificat',plate:'',km:0,trips:0,cost:0};
    vehicleStats[vid].km += (h.totalKm ?? h.total_km ?? 0);
    vehicleStats[vid].trips += 1;
    vehicleStats[vid].cost += (h.totalCost ?? h.total_cost ?? 0);
  });
  const vehList=Object.values(vehicleStats).filter(v=>v.km>0 || v.trips>0);
  const maxVehKm=Math.max(...vehList.map(v=>v.km),1);

  // Monthly stats
  const monthlyKmMap={};
  history.forEach(h=>{
    const m=h.date.slice(0,7);
    monthlyKmMap[m]=(monthlyKmMap[m]||0)+(h.totalKm ?? h.total_km ?? 0);
  });
  const monthKeys=Object.keys(monthlyKmMap).sort().reverse().slice(0,6);
  const maxMonthKm=Math.max(...monthKeys.map(k=>monthlyKmMap[k]),1);

  return(
    <div className="view">
      {/* Sub tabs */}
      <div style={{display:'flex',gap:8,marginBottom:14,background:'var(--surface-2)',padding:4,borderRadius:'var(--radius-md)'}}>
        <button className={`btn btn-sm ${subTab==='trips'?'btn-primary':'btn-outline'}`} style={{flex:1,border:'none',height:34}} onClick={()=>setSubTab('trips')}>
          <Icon name="clock" size={14}/> {t.tabHistory}
        </button>
        <button className={`btn btn-sm ${subTab==='analytics'?'btn-primary':'btn-outline'}`} style={{flex:1,border:'none',height:34}} onClick={()=>setSubTab('analytics')}>
          <Icon name="chart" size={14}/> {t.analyticsTitle}
        </button>
        <button className={`btn btn-sm ${subTab==='backup'?'btn-primary':'btn-outline'}`} style={{flex:1,border:'none',height:34}} onClick={()=>setSubTab('backup')}>
          <Icon name="database" size={14}/> {t.backupTitle}
        </button>
      </div>

      {subTab==='trips'&&(
        <>
          <div className="card" style={{marginBottom:14}}>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <div className="field" style={{flex:1,minWidth:160,marginBottom:0}}>
                <div className="input-wrap">
                  <input type="text" value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder={t.searchPlaceholder} style={{paddingLeft:34}}/>
                  <div style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text-3)',pointerEvents:'none'}}>
                    <Icon name="search" size={14}/>
                  </div>
                </div>
              </div>
              <div className="field" style={{width:140,marginBottom:0}}>
                <select value={filterMonth} onChange={e=>setFilterMonth(e.target.value)}>
                  <option value="">{t.allMonths}</option>
                  {months.map(m=><option key={m} value={m}>{fmtMonth(m)}</option>)}
                </select>
              </div>
            </div>
          </div>

          <div className="stats-grid">
            <div className="stat-box"><div className="stat-box-val">{sorted.length}</div><div className="stat-box-lbl">{t.tripsCount}</div></div>
            <div className="stat-box"><div className="stat-box-val">{kmRound(totalKm).toFixed(1)}</div><div className="stat-box-lbl">{t.historyTotalKm}</div></div>
            <div className="stat-box"><div className="stat-box-val">{totalCost>0?totalCost.toFixed(0)+'':'—'}</div><div className="stat-box-lbl">{t.historyTotalCost}</div></div>
          </div>

          {sorted.length===0?(
            <div style={{textAlign:'center',padding:'30px 0',color:'var(--text-3)',fontSize:14}}>
              {t.emptyHistoryTitle}
            </div>
          ):(
            sorted.map(h=>{
              const hKm = h.totalKm ?? h.total_km ?? 0;
              const hCost = h.totalCost ?? h.total_cost ?? 0;
              const hVeh = h.vehicle || h.vehicleName || '';
              return(
                <div key={h.id} className="history-item">
                  <div className="history-header" onClick={()=>toggle(h.id)}>
                    <div style={{flex:1,minWidth:0}}>
                      <div className="history-date">{fmtDate(h.date)}</div>
                      <div className="history-vehicle">{[hVeh,h.driver].filter(Boolean).join(' · ')||'—'}</div>
                    </div>
                    <div style={{textAlign:'right',marginRight:10}}>
                      <div className="history-km">{hKm.toFixed(1)} km</div>
                      {hCost>0&&<div className="history-cost">{hCost.toFixed(2)} RON</div>}
                    </div>
                    <Icon name={expanded[h.id]?'chevronUp':'chevronDown'} size={16}/>
                  </div>
                  {expanded[h.id]&&(
                    <div className="history-body">
                      {(h.segments||[]).map((seg,i)=>{
                        const opt=(h.segOpts||[])[i]||{};
                        const km=seg.km != null ? seg.km : (seg.km_oneway ? kmRound(seg.km_oneway*(opt.roundTrip?2:1)*(opt.reps||1)) : 0);
                        const purpose=seg.purpose || opt.purpose || '';
                        return(
                          <div key={i} className="history-seg">
                            <div style={{flex:1,minWidth:0}}>
                              <div>{seg.from} → {seg.to}</div>
                              {purpose&&<div className="history-purpose">{purpose}</div>}
                            </div>
                            <div style={{fontWeight:700,color:'var(--accent)',marginLeft:12,whiteSpace:'nowrap'}}>{km.toFixed(1)} km</div>
                          </div>
                        );
                      })}
                      {(h.odoStart||h.odoEnd)&&(
                        <div style={{fontSize:12,color:'var(--text-3)',marginTop:8}}>
                          Odometru: {h.odoStart||'—'} → {h.odoEnd||'—'} km
                        </div>
                      )}
                      <div className="history-actions">
                        <button className="btn-icon danger" onClick={()=>deleteTrip(h.id)} title={t.deleteConfirm || 'Șterge'}><Icon name="trash" size={14}/></button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })
          )}
        </>
      )}

      {subTab==='analytics'&&(
        <>
          <div className="card">
            <div className="card-title"><span className="card-title-dot"/>{t.analyticsFleetKm}</div>
            {vehList.length===0?(
              <div style={{textAlign:'center',padding:'16px 0',color:'var(--text-3)',fontSize:14}}>{t.analyticsNoData}</div>
            ):(
              vehList.map((v,idx)=>(
                <div key={idx} style={{marginBottom:14}}>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:600,marginBottom:4}}>
                    <span>{v.name} {v.plate?`(${v.plate})`:''}</span>
                    <span style={{color:'var(--accent)'}}>{v.km.toFixed(1)} km ({v.trips} curse)</span>
                  </div>
                  <div className="chart-bar">
                    <div className="chart-bar-fill" style={{width:`${Math.round((v.km/maxVehKm)*100)}%`}}/>
                  </div>
                </div>
              ))
            )}
          </div>

          <div className="card">
            <div className="card-title"><span className="card-title-dot"/>{t.analyticsMonthly}</div>
            {monthKeys.length===0?(
              <div style={{textAlign:'center',padding:'16px 0',color:'var(--text-3)',fontSize:14}}>{t.analyticsNoData}</div>
            ):(
              monthKeys.map((m,idx)=>{
                const km=monthlyKmMap[m]||0;
                return(
                  <div key={idx} style={{marginBottom:14}}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:600,marginBottom:4}}>
                      <span>{fmtMonth(m)}</span>
                      <span style={{color:'var(--accent)'}}>{km.toFixed(1)} km</span>
                    </div>
                    <div className="chart-bar">
                      <div className="chart-bar-fill" style={{width:`${Math.round((km/maxMonthKm)*100)}%`}}/>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </>
      )}

      {subTab==='backup'&&(
        <div className="card">
          <div className="card-title"><span className="card-title-dot"/>{t.backupTitle}</div>
          <p style={{fontSize:14,color:'var(--text-2)',lineHeight:1.5,marginBottom:16}}>
            {t.backupDesc}
          </p>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <button className="btn btn-primary" onClick={handleFullBackup} style={{height:44}}>
              <Icon name="download" size={16}/> {t.btnDownloadBackup}
            </button>
            <label className="btn btn-outline" style={{cursor:'pointer',height:44,display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <Icon name="upload" size={16}/> {t.btnRestoreBackup}
              <input type="file" accept=".json" style={{display:'none'}} onChange={handleFullRestore}/>
            </label>
          </div>
        </div>
      )}
      <div style={{height:8}}/>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const[theme,setTheme]=useState(getInitialTheme);
  const[lang,setLang]=useState(getInitialLang);
  const t=TRANSLATIONS[lang];

  const toggleLang=()=>{const n=lang==='en'?'ro':'en';setLang(n);localStorage.setItem('fp_lang',n)};

  const[tab,setTab]=useState('route');
  const[date,setDate]=useState(today);
  const[start,setStart]=useState({text:'',lat:null,lon:null,display:''});
  const[stops,setStops]=useState([{id:uid(),text:'',lat:null,lon:null,display:''}]);
  const[closeLoop,setCloseLoop]=useState(false);
  const[odoStart,setOdoStart]=useState('');
  const[odoEnd,setOdoEnd]=useState('');
  const[segments,setSegments]=useState([]);
  const[segOpts,setSegOpts]=useState([]);
  const[coords,setCoords]=useState([]);
  const[calculating,setCalculating]=useState(false);
  const[error,setError]=useState('');
  const[vehicles,setVehicles]=useState(loadVehicles);
  const[selectedVehicleId,setSelectedVehicleId]=useState('');
  const[showVehicleModal,setShowVehicleModal]=useState(false);
  const[company,setCompany]=useState(loadCompany);
  const[showCompanyModal,setShowCompanyModal]=useState(false);
  const[fuelLogs,setFuelLogs]=useState(loadFuelLogs);
  const[flashMsg,setFlashMsg]=useState('');
  const[showInstallModal,setShowInstallModal]=useState(false);
  const[deferredPrompt,setDeferredPrompt]=useState(null);
  const[isStandalone,setIsStandalone]=useState(()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true);

  const flash=(m)=>{setFlashMsg(m);setTimeout(()=>setFlashMsg(''),3500)};

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',theme);
    localStorage.setItem('fp_theme',theme);
    const themeColor = theme === 'dark' ? '#0A0A0A' : '#F5F5F5';
    const statusBarStyle = theme === 'dark' ? 'black-translucent' : 'default';
    const metaTheme = document.getElementById('meta-theme-color');
    if (metaTheme) metaTheme.setAttribute('content', themeColor);
    document.querySelectorAll('meta[name="theme-color"]').forEach(el => {
      el.setAttribute('content', themeColor);
      el.removeAttribute('media');
    });
    const metaStatus = document.getElementById('meta-status-bar');
    if (metaStatus) metaStatus.setAttribute('content', statusBarStyle);
  },[theme]);

  // PWA install prompt capture
  useEffect(()=>{
    const onPrompt=e=>{e.preventDefault();setDeferredPrompt(e)};
    const onInstalled=()=>{setIsStandalone(true);setShowInstallModal(false);setDeferredPrompt(null)};
    window.addEventListener('beforeinstallprompt',onPrompt);
    window.addEventListener('appinstalled',onInstalled);
    return()=>{window.removeEventListener('beforeinstallprompt',onPrompt);window.removeEventListener('appinstalled',onInstalled)};
  },[]);

  const handleNativeInstall=async()=>{
    if(!deferredPrompt)return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    setDeferredPrompt(null);
  };

  // Save vehicles to storage whenever they change
  useEffect(()=>{saveVehicles(vehicles)},[vehicles]);

  // Pre-populate from shared URL
  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    const enc=params.get('route');
    if(!enc)return;
    const data=decodeRoute(enc);
    if(!data)return;
    if(data.s){setStart({text:data.s.d||data.s.t,lat:null,lon:null,display:data.s.d||data.s.t})}
    if(data.o&&data.o.length){setStops(data.o.map(s=>({id:uid(),text:s.d||s.t,lat:null,lon:null,display:s.d||s.t})))}
    try{window.history.replaceState({},'',window.location.pathname);}catch{}
  },[]);

  const resolveAddr=async addr=>{
    if(addr.lat&&addr.lon)return addr;
    if(!addr.text||addr.text.length<3)return null;
    const results=await apiGeocode(addr.text);
    if(!results.length)return null;
    return{...addr,lat:results[0].lat,lon:results[0].lon,display:results[0].display};
  };

  const handleCalculate=async()=>{
    setError('');setCalculating(true);
    try{
      const validStops = stops.filter(s => s && s.text && s.text.trim().length >= 3);
      if(!validStops.length){
        setError(t.errNoStop ? t.errNoStop('') : (lang==='ro'?'Adaugă cel puțin o oprire sau destinație.':'Add at least one stop or destination.'));
        setCalculating(false);
        return;
      }
      const resolvedStart=await resolveAddr(start);
      if(!resolvedStart){setError(t.errNoStart);setCalculating(false);return}
      const resolvedStops=[];
      for(const s of stops){const r=await resolveAddr(s);if(!r){setError(t.errNoStop(s.text||'?'));setCalculating(false);return}resolvedStops.push(r)}
      setStart(resolvedStart);setStops(resolvedStops);
      const pts=[resolvedStart,...resolvedStops];
      if(closeLoop)pts.push(resolvedStart);
      const data=await apiRoute(pts.map(p=>[p.lat,p.lon]));
      const segs=data.legs_km.map((km,i)=>({from:pts[i].display,to:pts[i+1].display,km_oneway:km,min:data.legs_min?.[i]??null}));
      setSegments(segs);
      setSegOpts(segs.map(()=>({roundTrip:false,reps:1,purpose:''})));
      setCoords(data.coords||[]);
      setTab('segments');
    }catch(e){setError(typeof e==='string'?e:(e?.message?String(e.message):t.errUnexpected))}
    setCalculating(false);
  };

  const handleReset=()=>{
    setStart({text:'',lat:null,lon:null,display:''});
    setStops([{id:uid(),text:'',lat:null,lon:null,display:''}]);
    setCloseLoop(false);
    setOdoStart('');setOdoEnd('');
    setSegments([]);setSegOpts([]);setCoords([]);
    setError('');setFlashMsg('');
    setDate(today());
    setTab('route');
  };

  const handleSaveHistory=()=>{
    const vehicle=vehicles.find(v=>v.id===selectedVehicleId)||null;
    const total=segments.reduce((sum,seg,i)=>{const opt=segOpts[i]||{roundTrip:false,reps:1};return sum+kmRound(seg.km_oneway*(opt.roundTrip?2:1)*opt.reps)},0);
    let totalCost=0;
    if(vehicle&&vehicle.consumption&&vehicle.fuelPrice){
      totalCost=kmRound(total*parseFloat(vehicle.consumption)/100*parseFloat(vehicle.fuelPrice));
    }
    const finalOdoEnd = odoEnd || (odoStart ? String(Math.round(Number(odoStart) + total)) : '');
    const entry={
      id:uid(),date,
      vehicleId:vehicle?.id||'',
      vehicleName:vehicle?`${vehicle.name}${vehicle.plate?' '+vehicle.plate:''}`.trim():'',
      vehicle:vehicle?`${vehicle.name}${vehicle.plate?' '+vehicle.plate:''}`.trim():'',
      driver:vehicle?.driver||'',
      odoStart,odoEnd:finalOdoEnd,segments,segOpts,
      total_km:kmRound(total),
      totalKm:kmRound(total),
      total_cost:totalCost,
      totalCost:totalCost,
      savedAt:new Date().toISOString(),
    };
    const h=[entry,...loadHistory()];
    saveHistory(h);
    flash(t.msgTripSaved);
  };

  const mapPoints = [];
  if (start?.lat != null && start?.lon != null) {
    mapPoints.push({ lat: start.lat, lon: start.lon, name: start.display || start.text, label: 'S', color: '#6366F1' });
  }
  stops.forEach((s, idx) => {
    if (s?.lat != null && s?.lon != null) {
      mapPoints.push({ lat: s.lat, lon: s.lon, name: s.display || s.text, label: String(idx + 1), color: '#8B5CF6' });
    }
  });

  return(
    <>
      <div className="header">
        <div className="logo-wrap">
          <div className="logo-icon"><Icon name="car" size={20}/></div>
          <div>
            <div className="logo-title">{t.appTitle}</div>
            <div className="logo-sub">{t.appSub}</div>
          </div>
        </div>
        <div className="header-actions">
          <button className="theme-toggle" onClick={handleReset} title={t.btnNewRoute} style={{color:segments.length>0?'var(--accent)':'var(--text-3)'}}><Icon name="newRoute" size={17}/></button>
          <button className="theme-toggle" onClick={()=>setShowCompanyModal(true)} title={t.companyTitle}><Icon name="building" size={17}/></button>
          <button className="theme-toggle" onClick={()=>setShowVehicleModal(true)} title={t.vehiclesTitle}><Icon name="settings" size={17}/></button>
          <button className="theme-toggle" onClick={toggleLang} style={{fontSize:12,fontWeight:700,width:'auto',padding:'0 10px',minWidth:38}}>{lang==='en'?'RO':'EN'}</button>
          <button className="theme-toggle" onClick={()=>setTheme(th=>th==='dark'?'light':'dark')} title={theme==='dark'?t.themeLight:t.themeDark}><Icon name={theme==='dark'?'sun':'moon'} size={17}/></button>
        </div>
      </div>

      {calculating&&<div className="loader-overlay"><div className="loader-big"/><div className="loader-text">{t.loaderText}</div></div>}
      {showCompanyModal&&<CompanyModal company={company} onSave={setCompany} onClose={()=>setShowCompanyModal(false)} t={t}/>}
      {showVehicleModal&&<VehicleModal vehicles={vehicles} onSave={setVehicles} onClose={()=>setShowVehicleModal(false)} t={t}/>}
      {showInstallModal&&<InstallModal canInstall={!!deferredPrompt} onNativeInstall={handleNativeInstall} onClose={()=>setShowInstallModal(false)} t={t}/>}

      <div className="main">
        {(error||flashMsg)&&(
          <div style={{padding:'18px 16px 0',maxWidth:680,margin:'0 auto'}}>
            {error&&<div className="alert alert-error">{error}</div>}
            {flashMsg&&<div className="alert alert-success">{flashMsg}</div>}
          </div>
        )}

        {!isStandalone&&(
          <div style={{padding:'16px 16px 0',maxWidth:680,margin:'0 auto'}}>
            <button className="install-banner" onClick={()=>setShowInstallModal(true)}>
              <span style={{display:'flex',alignItems:'center',gap:11}}>
                <Icon name="install" size={22}/>
                <span style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:1}}>
                  <span style={{fontWeight:700,fontSize:14}}>{t.btnInstall}</span>
                  <span style={{fontSize:12,opacity:0.8,fontWeight:500}}>{t.installBannerSub}</span>
                </span>
              </span>
              <span style={{display:'flex',transform:'rotate(-90deg)',opacity:0.6}}><Icon name="chevronDown" size={16}/></span>
            </button>
          </div>
        )}

        {tab==='route'&&<RouteView date={date} setDate={setDate} start={start} setStart={setStart} stops={stops} setStops={setStops} closeLoop={closeLoop} setCloseLoop={setCloseLoop} odoStart={odoStart} setOdoStart={setOdoStart} odoEnd={odoEnd} setOdoEnd={setOdoEnd} vehicles={vehicles} selectedVehicleId={selectedVehicleId} setSelectedVehicleId={setSelectedVehicleId} onCalculate={handleCalculate} calculating={calculating} t={t} setFlashMsg={flash}/>}
        {tab==='segments'&&<SegmentsView segments={segments} segOpts={segOpts} setSegOpts={setSegOpts} vehicles={vehicles} selectedVehicleId={selectedVehicleId} onGoRoute={()=>setTab('route')} onSaveHistory={handleSaveHistory} t={t}/>}
        {tab==='fuel'&&<FuelView vehicles={vehicles} selectedVehicleId={selectedVehicleId} fuelLogs={fuelLogs} setFuelLogs={setFuelLogs} company={company} t={t} flash={flash}/>}
        {tab==='export'&&<ExportView segments={segments} segOpts={segOpts} date={date} start={start} stops={stops} vehicles={vehicles} selectedVehicleId={selectedVehicleId} setStart={setStart} setStops={setStops} setSegments={setSegments} setSegOpts={setSegOpts} setTab={setTab} company={company} odoStart={odoStart} odoEnd={odoEnd} fuelLogs={fuelLogs} t={t} lang={lang}/>}
        {tab==='history'&&<HistoryView vehicles={vehicles} setTab={setTab} company={company} fuelLogs={fuelLogs} templates={loadTemplates()} t={t} flash={flash}/>}
      </div>

      {/* Map is always mounted but shown/hidden; fixed layer between header and nav */}
      <MapView coords={coords} points={mapPoints} isActive={tab==='map'} t={t}/>

      <nav className="bottom-nav">
        <button className={`nav-tab ${tab==='route'?'active':''}`} onClick={()=>setTab('route')}>
          <span className="nav-icon"><Icon name="map" size={19}/></span>
          <span className="nav-label">{t.tabRoute}</span>
        </button>
        <button className={`nav-tab ${tab==='map'?'active':''}`} onClick={()=>setTab('map')}>
          <span className="nav-icon"><Icon name="pin" size={19}/></span>
          <span className="nav-label">{t.tabMap}</span>
        </button>
        <button className={`nav-tab ${tab==='segments'?'active':''}`} onClick={()=>setTab('segments')}>
          <span className="nav-icon"><Icon name="list" size={19}/></span>
          <span className="nav-label">{t.tabSegments}</span>
        </button>
        <button className={`nav-tab ${tab==='fuel'?'active':''}`} onClick={()=>setTab('fuel')}>
          <span className="nav-icon"><Icon name="fuel" size={19}/></span>
          <span className="nav-label">{t.tabFuel}</span>
        </button>
        <button className={`nav-tab ${tab==='export'?'active':''}`} onClick={()=>setTab('export')}>
          <span className="nav-icon"><Icon name="download" size={19}/></span>
          <span className="nav-label">{t.tabExport}</span>
        </button>
        <button className={`nav-tab ${tab==='history'?'active':''}`} onClick={()=>setTab('history')}>
          <span className="nav-icon"><Icon name="clock" size={19}/></span>
          <span className="nav-label">{t.tabHistory}</span>
        </button>
      </nav>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/static/sw.js')
      .then(r=>console.log('SW:',r.scope))
      .catch(e=>console.warn('SW fail:',e));
  });
}
</script>
</body>
</html>
